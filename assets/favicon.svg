<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bg { fill: #26335C; }
      .e-dark { display: none; }
      .e-light { display: block; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d121f; }
        .e-light { display: none; }
        .e-dark { display: block; }
      }
    </style>
    <clipPath id="r"><rect width="64" height="64" rx="13"/></clipPath>
  </defs>
  <rect class="bg" width="64" height="64" rx="13"/>
  <g clip-path="url(#r)">
    <image class="e-light" href="data:image/png;base64," width="64" height="64"/>
    <image class="e-dark"  href="data:image/png;base64," width="64" height="64"/>
  </g>
</svg>